name: Check ansible with lint
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  Check-ansible-syntax:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run ansible lint check
        uses: ansible/ansible-lint@9bce2bfb8f4a984e6b13767bc0d6bf0a49492164
        with:
          requirements_file: collections/requirements.yml

  validate:
    name: Validate terraform files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba

      - name: Check formatting
        run: terraform -chdir=cloudflare fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=cloudflare init -input=false -backend=false

      - name: Validate Terraform
        run: terraform -chdir=cloudflare validate -no-color
